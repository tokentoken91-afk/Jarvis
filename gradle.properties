# Project-wide Gradle settings for JARVIS Android
# Tuned for both standard development machines and mobile devices (e.g. Vivo Y21d / Termux / AndroidIDE)

org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX and modern R class flags
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin coding conventions
kotlin.code.style=official
